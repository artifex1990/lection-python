[project]
name = "hangman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stokato", email = "pavel@demjanov.ru" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hangman = "hangman:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]